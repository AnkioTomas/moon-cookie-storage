<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moon 登录授权</title>
    <link rel="stylesheet" href="wait.css" />
  </head>
  <body data-phase="loading">
    <main>
      <header>
        <span class="moon" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Moon Cookie Storage</p>
          <h1>登录授权</h1>
        </div>
      </header>
      <p class="lead">请核对接收设备和采集范围。确认后才会打开登录页，并加密发送所选凭证。远程管理验证保存成功后，登录页和本页会自动关闭。</p>
      <dl id="details"></dl>
      <p class="warning">Cookie（含 HttpOnly）和 Storage 可能包含完整账号访问凭证。仅授权你信任的 Moon 设备；端口 9528 不代表身份已验证。HTTP 回调仍有局域网中间人风险，建议使用 HTTPS。</p>
      <footer>
        <p id="status" role="status">正在读取授权任务…</p>
        <div class="actions">
          <button id="cancel" class="ghost">取消</button>
          <button id="retry" class="ghost" hidden>重试</button>
          <button id="start" class="primary" disabled>授权并打开登录页</button>
        </div>
      </footer>
    </main>
    <script type="module" src="wait.js"></script>
  </body>
</html>
