<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moon 登录授权</title>
    <link rel="stylesheet" href="wait.css" />
  </head>
  <body>
    <main>
      <h1>Moon 登录授权</h1>
      <p>请确认以下信息。授权后将打开登录页，每约 2 秒检查一次，
        并把所选登录凭证加密发送给远程管理。远程管理验证并保存成功后自动关闭登录页和本页。</p>
      <dl id="details"></dl>
      <p class="warning">Cookie（含 HttpOnly）和 Storage 可能包含完整账号访问凭证。
        仅授权你信任的 Moon 设备；端口 9528 不代表身份已验证。
        HTTP 回调仍存在局域网中间人风险，建议使用 HTTPS。</p>
      <p id="status" role="status">正在读取授权任务…</p>
      <button id="start" disabled>授权并打开登录页</button>
      <button id="retry" hidden>重试</button>
      <button id="cancel">取消</button>
    </main>
    <script type="module" src="wait.js"></script>
  </body>
</html>
